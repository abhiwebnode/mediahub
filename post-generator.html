<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Generator</title>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface2: #f0f0f2;
    --border: #e0e0e5;
    --border2: #c8c8d0;
    --text: #111118;
    --text2: #555566;
    --text3: #999aaa;
    --accent: #5046e5;
    --accent-bg: #eeeeff;
    --accent-light: #5046e5;
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 40px;
  }

  .container {
    max-width: 540px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  header p {
    font-size: 13px;
    color: var(--text2);
    margin-top: 4px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 12px;
  }

  .section-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    font-weight: 500;
  }

  .pill-group {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .pill {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }

  .pill:hover:not(.active) {
    border-color: var(--accent);
    color: var(--text);
  }

  .pill.active {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent-light);
  }

  .topic-wrap {
    margin-top: 4px;
  }

  .topic-input {
    width: 100%;
    padding: 9px 13px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }

  .topic-input::placeholder { color: var(--text3); }
  .topic-input:focus { border-color: var(--accent); }

  .api-input {
    width: 100%;
    padding: 9px 13px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 13px;
    font-family: 'Courier New', monospace;
    outline: none;
    transition: border-color 0.15s;
  }

  .api-input::placeholder { color: var(--text3); }
  .api-input:focus { border-color: var(--accent); }

  .api-note {
    font-size: 11px;
    color: var(--text3);
    margin-top: 6px;
  }

  .btn-generate {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    margin-bottom: 12px;
  }

  .btn-generate:hover { opacity: 0.9; }
  .btn-generate:active { transform: scale(0.99); }
  .btn-generate:disabled { opacity: 0.45; cursor: not-allowed; }

  .output-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 12px;
    display: none;
  }

  .output-card.visible { display: block; }

  .output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .output-tag {
    font-size: 11px;
    color: var(--accent-light);
    background: var(--accent-bg);
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--accent);
  }

  .output-text {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .char-count {
    font-size: 12px;
    color: var(--text3);
    margin-top: 10px;
    text-align: right;
  }

  .char-warn { color: var(--warning); }
  .char-ok { color: var(--success); }

  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .btn-action {
    flex: 1;
    padding: 9px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text2);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-action:hover { border-color: var(--accent); color: var(--text); }

  .status {
    font-size: 12px;
    color: var(--text3);
    text-align: center;
    min-height: 18px;
    margin-top: 4px;
  }

  .status.err { color: var(--danger); }
  .status.ok { color: var(--success); }

  .generating-text {
    display: none;
    text-align: center;
    padding: 20px;
    color: var(--text2);
    font-size: 14px;
  }

  .dot-anim::after {
    content: '';
    animation: dots 1.4s infinite;
  }

  @keyframes dots {
    0%   { content: ''; }
    33%  { content: '.'; }
    66%  { content: '..'; }
    100% { content: '...'; }
  }

  .divider { height: 1px; background: var(--border); margin: 4px 0 12px; }
</style>
</head>
<body>

<div class="container">

  <header>
    <h1>Post Generator</h1>
    <p>NearPop · TaxSavingLab · UploadSure · CouponBoyz</p>
  </header>

  <!-- Project -->
  <div class="card">
    <div class="section-label">Project</div>
    <div class="pill-group" id="project-pills">
      <button class="pill active" data-val="nearpop">NearPop</button>
      <button class="pill" data-val="taxsavinglab">TaxSavingLab</button>
      <button class="pill" data-val="uploadsure">UploadSure</button>
      <button class="pill" data-val="couponboyz">CouponBoyz</button>
    </div>
  </div>

  <!-- Platform -->
  <div class="card">
    <div class="section-label">Platform</div>
    <div class="pill-group" id="platform-pills">
      <button class="pill active" data-val="instagram">Instagram</button>
      <button class="pill" data-val="twitter">X / Twitter</button>
      <button class="pill" data-val="linkedin">LinkedIn</button>
    </div>
  </div>

  <!-- Goal -->
  <div class="card">
    <div class="section-label">Goal</div>
    <div class="pill-group" id="goal-pills">
      <button class="pill active" data-val="awareness">Awareness</button>
      <button class="pill" data-val="feature">Feature launch</button>
      <button class="pill" data-val="engagement">Engagement</button>
      <button class="pill" data-val="traffic">Drive traffic</button>
    </div>
  </div>

  <!-- Topic -->
  <div class="card topic-wrap">
    <div class="section-label">Specific angle or topic <span style="color:var(--text3);font-size:10px;text-transform:none;letter-spacing:0">(optional)</span></div>
    <input class="topic-input" id="topic" type="text" placeholder="e.g. merchant onboarding, new PDF tool, Diwali deals...">
  </div>

  <!-- Generate button -->
  <button class="btn-generate" id="btn-gen" onclick="generate()">Generate Post</button>

  <!-- Generating state -->
  <div class="generating-text" id="gen-loading">
    Writing your post<span class="dot-anim"></span>
  </div>

  <!-- Output -->
  <div class="output-card" id="output-card">
    <div class="output-header">
      <div class="section-label" style="margin:0">Generated post</div>
      <span class="output-tag" id="output-tag">Instagram · NearPop</span>
    </div>
    <div class="divider"></div>
    <div class="output-text" id="output-text"></div>
    <div class="char-count" id="char-count"></div>
    <div class="action-row">
      <button class="btn-action" id="btn-copy" onclick="copyPost()">Copy</button>
      <button class="btn-action" onclick="generate()">Regenerate</button>
    </div>
  </div>

  <div class="status" id="status"></div>

</div>

<script>
const VOICES = {
  nearpop: `You write social media posts for NearPop — a GPS-based hyperlocal discovery app for Delhi NCR. It helps people find real local shops and services near them. Live on the Play Store.

TONE: Local, confident, slightly proud. Speaks like a smart Delhi local. Direct and energetic. Can use Hindi words naturally (aas-paas, dukaan, bilkul) but don't force it. Not startup-jargon. Excited but not cringe.

DO: Hyperlocal discovery that works. Delhi NCR focus as a strength. Merchants getting found without burning ad money. Real neighbourhood feel.
DON'T: Say "disrupting", "ecosystem", "seamless experience". Don't compare to Yelp or Google Maps. Don't claim massive scale.

INSTAGRAM: Conversational caption. Hashtags at the end on separate lines after two blank dots.
Hashtag pool (pick 6-8 relevant): #NearPop #HyperlocalDelhi #DelhiNCR #LocalDiscovery #DelhiApp #NearMe #ShopLocal #DelhiStartup #MadeInIndia

X/TWITTER: Max 240 characters total including hashtags. Lead with the hook. 2-3 hashtags inline or at end.

LINKEDIN: Professional but human. No hashtags. 3-5 short paragraphs max.`,

  taxsavinglab: `You write social media posts for TaxSavingLab — a free Indian trader tax calculator at taxsavinglab.com. Handles F&O, equity, intraday. Features: CYLA/BFLA waterfall, 87A rebate, slab auto-derivation. Supports Dhan and Zerodha P&L uploads. No login required, no data stored.

TONE: Knowledgeable, practical, on the trader's side. Like a CA friend who explains plainly. Uses correct Indian tax terms (STCG, LTCG, CYLA, ITR-3, speculative income) naturally. Calm authority. Occasional dry humour about ITR season stress is fine.

DO: Lead with "free". Highlight complexity it handles automatically. Mention no login, no data stored. Include taxsavinglab.com.
DON'T: Give specific tax advice. Use stock market hype language. Overpromise accuracy.

X/TWITTER: Max 240 chars. Include taxsavinglab.com and 2-3 hashtags.
Hashtag pool: #TaxSavingLab #TraderTax #FnOTax #ITRFiling #IncomeTax #IndianTrader #StockMarketIndia #TaxCalculator #ITR3

LINKEDIN: More detailed, can use bullet points, good for credibility posts.

INSTAGRAM: Simpler, relatable, avoid jargon. Include hashtags at end.`,

  uploadsure: `You write social media posts for UploadSure — browser-based tools at uploadsure.in that fix files to Indian form upload specs. Features: compress image/PDF to exact KB, resize to exact pixels, PDF tools (merge, split, rotate, watermark etc). Works entirely in browser — nothing uploaded to any server. Free.

TONE: Helpful, calm, gets it done. Speaks directly to the frustration of form portals rejecting files. Simple language — this audience is not technical. Reassuring about privacy.

DO: Lead with the relatable problem (form rejected your file). Emphasise EXACT output — not "about 50KB", exactly 50KB. Mention it works in browser. Covers SSC, UPSC, IBPS, JEE, NEET, Passport, PAN, KYC portals. Include uploadsure.in.
DON'T: Use technical terms (binary search, pixel interpolation, compression algorithm). Position as a design tool.

INSTAGRAM: Visual, relate to the form rejection pain. Hashtags at end.
Hashtag pool: #UploadSure #FormUpload #GovernmentForms #SSCExam #UPSCPrep #CompressImage #PDFTools #IndiaForms #OnlineForms #JobApplication

X/TWITTER: Max 240 chars. Lead with relatable problem. Include uploadsure.in and hashtags.`,

  couponboyz: `You write social media posts for CouponBoyz — an affiliate deals and coupon site for India, over 10 years old. Curates best deals from Indian e-commerce (Flipkart, Amazon, Myntra etc).

TONE: Enthusiastic, friendly, deal-obsessed. Like the friend who always finds the promo code. High energy but not fake or spammy. Can use casual Hindi (loot lo, kal tak, ekdum sahi). Emojis are fine and encouraged for deals content.

DO: Lead with the deal — price, discount %, saving amount. Create urgency only if real. Get to the deal fast. Be specific (name the product, the price).
DON'T: Post vague "great deals available" type content. Use corporate language. Pad with filler. Make up urgency.

INSTAGRAM: Product + price + discount up front. Hashtags at end.
Hashtag pool: #CouponBoyz #DealsIndia #OnlineShopping #BestDeals #OfferAlert #LootDeal #DiscountIndia #FlipkartDeals #AmazonIndia

X/TWITTER: Max 240 chars. Price and % off first. 2-3 hashtags.

TELEGRAM/WHATSAPP style (if platform is "linkedin" for CouponBoyz, treat as WhatsApp-forward style): Short, scannable, shareable. Price bold, link clear, no fluff.`
};

let currentPost = '';
let selectedProject = 'nearpop';
let selectedPlatform = 'instagram';
let selectedGoal = 'awareness';

function initPills(groupId, setter) {
  document.getElementById(groupId).querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => {
      document.getElementById(groupId).querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      setter(p.dataset.val);
    });
  });
}

initPills('project-pills', v => selectedProject = v);
initPills('platform-pills', v => selectedPlatform = v);
initPills('goal-pills', v => selectedGoal = v);

async function generate() {
  const apiKey = 'AQ.Ab8RN6JR-9rv93yv-xnOwQlhuVl5tro6ijKPfsdsugNsbpJ3CA';

  const btn = document.getElementById('btn-gen');
  const loading = document.getElementById('gen-loading');
  const outputCard = document.getElementById('output-card');
  const topic = document.getElementById('topic').value.trim();

  btn.disabled = true;
  btn.textContent = 'Generating...';
  loading.style.display = 'block';
  outputCard.classList.remove('visible');
  setStatus('', '');

  const platformLabel = { instagram: 'Instagram', twitter: 'X/Twitter', linkedin: 'LinkedIn' }[selectedPlatform];
  const goalLabel = {
    awareness: 'brand awareness',
    feature: 'announcing a new feature or update',
    engagement: 'driving engagement and interaction',
    traffic: 'driving traffic to the website'
  }[selectedGoal];

  const userPrompt = `Write ONE ${platformLabel} post for ${goalLabel}.${topic ? ' Specific angle: ' + topic + '.' : ''}

Output only the post text — no intro, no label, no explanation. Just the ready-to-publish post.`;

  try {
    const resp = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: VOICES[selectedProject] }] },
          contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
          generationConfig: { maxOutputTokens: 600, temperature: 0.9 }
        })
      }
    );

    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.error?.message || 'API error ' + resp.status);
    }

    const data = await resp.json();
    currentPost = (data.candidates?.[0]?.content?.parts?.[0]?.text || '').trim();

    document.getElementById('output-text').textContent = currentPost;
    document.getElementById('output-tag').textContent =
      platformLabel + ' · ' + { nearpop: 'NearPop', taxsavinglab: 'TaxSavingLab', uploadsure: 'UploadSure', couponboyz: 'CouponBoyz' }[selectedProject];

    updateCharCount(currentPost);
    outputCard.classList.add('visible');
    document.getElementById('btn-copy').textContent = 'Copy';
    setStatus('', '');

  } catch(e) {
    setStatus(e.message, 'err');
  }

  btn.disabled = false;
  btn.textContent = 'Generate Post';
  loading.style.display = 'none';
}

function updateCharCount(text) {
  const el = document.getElementById('char-count');
  if (!text) { el.textContent = ''; return; }
  const len = text.length;
  if (selectedPlatform === 'twitter') {
    el.textContent = len + ' / 280 chars';
    el.className = 'char-count ' + (len > 280 ? 'char-warn' : 'char-ok');
  } else {
    el.textContent = len + ' characters';
    el.className = 'char-count';
  }
}

async function copyPost() {
  if (!currentPost) return;
  try {
    await navigator.clipboard.writeText(currentPost);
    const btn = document.getElementById('btn-copy');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
  } catch(e) {
    setStatus('Copy failed — select text manually.', 'err');
  }
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}
</script>
</body>
</html>
